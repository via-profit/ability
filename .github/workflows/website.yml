name: Website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'src/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Check SSR
        working-directory: website
        run: |
          node dist/server.cjs &
          server=$!
          trap 'kill "$server"' EXIT
          curl -fsS --retry 10 --retry-connrefused http://localhost:8080/en/docs/dsl -o /tmp/ability-en.html
          curl -fsS http://localhost:8080/ru/docs/dsl -o /tmp/ability-ru.html
          grep -q '<html lang="en">' /tmp/ability-en.html
          grep -q '<html lang="ru">' /tmp/ability-ru.html
          grep -q '<h1 ' /tmp/ability-en.html
          grep -q '<h1 ' /tmp/ability-ru.html
          grep -Fq '\"loaderData\":{}' /tmp/ability-en.html
          grep -Fq '\"loaderData\":{}' /tmp/ability-ru.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ru/docs/missing)" = 404
